<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Photo Enhancing Project</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(45deg, #6a11cb, #2575fc, #00c6ff, #ff8a00);
      background-size: 400% 400%;
      animation: gradientAnimation 15s ease infinite;
      color: white;
    }

    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      background: rgba(0, 0, 0, 0.7);
      padding: 2rem;
      text-align: center;
    }

    footer {
      background: rgba(0, 0, 0, 0.7);
      padding: 1rem;
      text-align: center;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      height: auto;
      object-fit: cover;
      display: block;
      border-radius: 10px;
    }

    .caption {
      text-align: center;
      margin-top: 0.5rem;
      color: #222;
      font-weight: 600;
    }
  </style>
</head>
<body>

<header class="position-relative">
  <div class="position-absolute top-0 start-0 p-3">
    <a href="homepage.html" class="btn btn-outline-light me-2">Back to Homepage</a>
    <a href="project.html" class="btn btn-outline-light">Back</a>
  </div>

  <h1>Photo Enhancing Project</h1>
  <p>Click an edited photo to toggle between edited and original version</p>
</header>

<main class="container my-5">
  <h2 class="text-center" id="galleryTitle">Edited Photos</h2>
  <div class="row row-cols-1 row-cols-md-3 g-4" id="gallery"></div>
</main>

<footer>
  <p>&copy; 2024 Carlo J. Baleje. All Rights Reserved.</p>
</footer>

<script>
  const images = [
    'IMG_3163.jpg',
    'IMG_3164.jpg',
    'IMG_3165.jpg',
    'IMG_3168.jpg',
    'IMG_3169.jpg',
    'IMG_3172.jpg',
    'IMG_3173.jpg',
    'IMG_3174.jpg'
  ];

  // Google Drive URL for IMG_3163.jpg
  const specialOriginalLinks = {
    'IMG_3163.jpg': 'https://drive.google.com/file/d/1QuM-rNAub-cDCKtORwCPZbs-9ssuLxRY/view?usp=drive_link'
  };

  const gallery = document.getElementById('gallery');

  images.forEach(filename => {
    const col = document.createElement('div');
    col.className = 'col';

    const card = document.createElement('div');
    card.className = 'card';

    const img = document.createElement('img');
    img.src = `new/${filename}`;
    img.alt = `Edited version of ${filename}`;
    img.dataset.editedSrc = img.src;
    img.dataset.originalSrc = `old/${filename}`;
    img.dataset.isOriginal = 'false';

    img.onerror = () => {
      img.src = 'https://via.placeholder.com/400x300?text=Edited+Not+Found';
    };

    card.appendChild(img);

    const caption = document.createElement('div');
    caption.className = 'caption';
    caption.textContent = 'Edited Photo';

    col.appendChild(card);
    col.appendChild(caption);
    gallery.appendChild(col);

    card.addEventListener('click', () => {
      // If clicked image is the special one, open Drive link in new tab
      if (filename === 'IMG_3163.jpg') {
        window.open(specialOriginalLinks[filename], '_blank');
        return;
      }

      if (img.dataset.isOriginal === 'false') {
        img.src = img.dataset.originalSrc;
        img.alt = `Original version of ${filename}`;
        caption.textContent = 'Original Photo';
        img.dataset.isOriginal = 'true';
      } else {
        img.src = img.dataset.editedSrc;
        img.alt = `Edited version of ${filename}`;
        caption.textContent = 'Edited Photo';
        img.dataset.isOriginal = 'false';
      }
    });
  });
</script>

</body>
</html>
