  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Photo Enhancing Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        background: linear-gradient(45deg, #6a11cb, #2575fc, #00c6ff, #ff8a00);
        background-size: 400% 400%;
        animation: gradientAnimation 15s ease infinite;
        color: white;
      }

      @keyframes gradientAnimation {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      header {
        background: rgba(0, 0, 0, 0.7);
        padding: 2rem;
        text-align: center;
      }

      footer {
        background: rgba(0, 0, 0, 0.7);
        padding: 1rem;
        text-align: center;
      }

      .card {
        background: white;
        border-radius: 10px;
        overflow: hidden;
      }

      .card img {
        width: 100%;
        height: auto;
      }
    </style>
  </head>
  <body>

  <header class="position-relative">
  <div class="position-absolute top-0 start-0 p-3">
    <a href="homepage.html" class="btn btn-outline-light me-2">Back to Homepage</a>
    <a href="project.html" class="btn btn-outline-light">Back</a>
  </div>

  <h1>Photo Enhancing Project</h1>
  <p>View Enhanced or Original Photos</p>
  <button class="btn btn-primary mx-1" onclick="loadImages('new')">Edited</button>
  <button class="btn btn-secondary mx-1" onclick="loadImages('old')">Original</button>
</header>


  <main class="container my-5">
    <h2 class="text-center" id="galleryTitle">Edited Photos</h2>
    <div class="row row-cols-1 row-cols-md-3 g-4" id="gallery"></div>
  </main>

  <footer>
    <p>&copy; 2024 Carlo J. Baleje. All Rights Reserved.</p>
  </footer>

  <script>
    const images = {
      new: [
        'https://drive.google.com/uc?export=view&id=16L9mP7h59qWS6cNIiyXWOBVIRKEXwB8R',
        'https://drive.google.com/uc?export=view&id=1RDWBcbVds6Jc18O5Wngjhq2UCi4pedUA',
        'https://drive.google.com/uc?export=view&id=1m8Q7uC1SkNm4JG3aCg17HQW0b9Z9FiUc',
        'https://drive.google.com/uc?export=view&id=19w2O4EU5xZOJlvHex1ATOYnuKgBpQyVy',
        'https://drive.google.com/uc?export=view&id=1ISXfD8FxZXkdUEkYvbGTsMZQzEzbD44a',
        'https://drive.google.com/uc?export=view&id=13RRsx1ohIoh2DE22dA7DYDBUeY_CA3r0',
        'https://.google.com/uc?export=view&id=1ntuKpgtCSdZmiZHet0GzCmn3k0-72dD1',
        'https://drive.google.com/uc?export=view&id=1ws0xgyO8nnnVIPhbgnXI129u8BaziwvQ'
      ],
      old: [
        'https://drive.google.com/uc?export=view&id=1QuM-rNAub-cDCKtORwCPZbs-9ssuLxRY',
        'https://drive.google.com/uc?export=view&id=1EZwyTXKIm3eFriVfZgM_DRLj-2mqwwVP',
        'https://drive.google.com/uc?export=view&id=1_k2KsJNpEJyFAkbZSi94vwhZbvy2MYwk',
        'https://drive.google.com/uc?export=view&id=1rHbZp55QSmyyPU-pIqytLb-C7_l4j9hQ',
        'https://drive.google.com/uc?export=view&id=1Jd2D1alOMeIAnCpQqfvjKKTjWRa5OOH1',
        'https://drive.google.com/uc?export=view&id=1r9Sx77lvqatGqERrxWwh5qNdxtYDxRGW',
        'https://drive.google.com/uc?export=view&id=1h27w96ukr7tOTmQwAhBFnn39YlhqhBJp',
        'https://drive.google.com/uc?export=view&id=1oVDXnfd4ERMHq0K_VkOeAdmO6IDpanqp'
      ]
    };

    function loadImages(type) {
  const gallery = document.getElementById('gallery');
  const title = document.getElementById('galleryTitle');

  title.textContent = type === 'new' ? 'Edited Photos' : 'Original Photos';
  gallery.innerHTML = '';

  images[type].forEach(img => {
    const col = document.createElement('div');
    col.className = 'col';
    col.innerHTML = `
      <div class="card">
        <img src="${img}" alt="photo" />
      </div>`;
    gallery.appendChild(col);
  });
}


    // Load "Edited" by default on page load
    window.onload = () => loadImages('new');
  </script>


  </body>
  </html>
