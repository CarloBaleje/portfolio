<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Photo Enhancing Project</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(45deg, #6a11cb, #2575fc, #00c6ff, #ff8a00);
      background-size: 400% 400%;
      animation: gradientAnimation 15s ease infinite;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      background: rgba(0, 0, 0, 0.7);
      padding: 2rem 1rem;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    header .btn-group {
      position: absolute;
      top: 1rem;
      left: 1rem;
    }

    footer {
      background: rgba(0, 0, 0, 0.7);
      padding: 1rem;
      text-align: center;
      margin-top: auto;
      font-size: 0.9rem;
      user-select: none;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      transition: transform 0.3s ease;
      cursor: pointer;
    }
    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }

    .card img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 10px;
      object-fit: cover;
    }
  </style>
</head>
<body>

<header>
  <div class="btn-group">
    <a href="homepage.html" class="btn btn-outline-light me-2">Back to Homepage</a>
    <a href="project.html" class="btn btn-outline-light">Back</a>
  </div>

  <h1>Photo Enhancing Project</h1>
  <p>View Enhanced or Original Photos</p>
  <button class="btn btn-primary mx-1" onclick="loadImages('new')">Edited</button>
  <button class="btn btn-secondary mx-1" onclick="loadImages('old')">Original</button>
</header>

<main class="container my-5 flex-grow-1">
  <h2 class="text-center mb-4" id="galleryTitle">Edited Photos</h2>
  <div class="row row-cols-1 row-cols-md-3 g-4" id="gallery" aria-live="polite"></div>
</main>

<footer>
  <p>&copy; 2024 Carlo J. Baleje. All Rights Reserved.</p>
</footer>

<script>
    const images = {
      new: [
        'IMG_3163.jpg',
        'IMG_3164.jpg',
        'IMG_3165.jpg',
        'IMG_3168.jpg',
        'IMG_3169.jpg',
        'IMG_3172.jpg',
        'IMG_3173.jpg',
        'IMG_3174.jpg'
      ],
      old: [
        'IIMG_3163.jpg',
        'IIMG_3164.jpg',
        'IIMG_3165.jpg',
        'IIMG_3168.jpg',
        'IIMG_3169.jpg',
        'IIMG_3172.jpg',
        'IIMG_3173.jpg',
        'IIMG_3174.jpg'
      ]
    };

   function loadImages(type) {
  const folder = `${type}/`; // folder is either 'new/' or 'old/'
  const gallery = document.getElementById('gallery');
  const title = document.getElementById('galleryTitle');

  title.textContent = type === 'new' ? 'Edited Photos' : 'Original Photos';
  gallery.innerHTML = '';

  images[type].forEach(img => {
    const col = document.createElement('div');
    col.className = 'col';

    col.innerHTML = `
      <div class="card shadow-sm" tabindex="0" role="group" aria-label="Photo card">
        <img src="${folder}${img}" alt="Photo from ${type === 'new' ? 'edited' : 'original'} gallery" loading="lazy"
        onerror="this.onerror=null; this.src='https://via.placeholder.com/400x300?text=Image+Not+Found';" />
      </div>`;

    gallery.appendChild(col);
  });
}


  // Load "Edited" images on page load
  window.onload = () => loadImages('new');
</script>

</body>
</html>
