<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Photo Enhancing Project</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(45deg, #6a11cb, #2575fc, #00c6ff, #ff8a00);
      background-size: 400% 400%;
      animation: gradientAnimation 15s ease infinite;
      color: white;
    }

    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      background: rgba(0, 0, 0, 0.7);
      padding: 2rem;
      text-align: center;
    }

    footer {
      background: rgba(0, 0, 0, 0.7);
      padding: 1rem;
      text-align: center;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
    }

    .card img {
      width: 100%;
      height: auto;
      object-fit: cover;
    }

    .modal-content {
      background-color: #000;
    }

    .modal-body {
      position: relative;
      min-height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal-body img {
      width: 100%;
      border-radius: 10px;
      display: none; /* Hide initially, show after loading */
    }

    .spinner-border {
      width: 3rem;
      height: 3rem;
      color: white;
    }
  </style>
</head>
<body>

<header class="position-relative">
  <div class="position-absolute top-0 start-0 p-3">
    <a href="homepage.html" class="btn btn-outline-light me-2">Back to Homepage</a>
    <a href="project.html" class="btn btn-outline-light">Back</a>
  </div>

  <h1>Photo Enhancing Project</h1>
  <p>Click an edited photo to view its original version</p>
</header>

<main class="container my-5">
  <h2 class="text-center" id="galleryTitle">Edited Photos</h2>
  <div class="row row-cols-1 row-cols-md-3 g-4" id="gallery"></div>
</main>

<footer>
  <p>&copy; 2024 Carlo J. Baleje. All Rights Reserved.</p>
</footer>

<!-- Modal -->
<div class="modal fade" id="originalModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title text-white" id="modalTitle">Original Photo</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div id="loadingSpinner" class="spinner-border" role="status" aria-hidden="true"></div>
        <img id="originalImage" src="" alt="Original Photo">
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const images = [
    'IMG_3163.jpg',
    'IMG_3164.jpg',
    'IMG_3165.jpg',
    'IMG_3168.jpg',
    'IMG_3169.jpg',
    'IMG_3172.jpg',
    'IMG_3173.jpg',
    'IMG_3174.jpg'
  ];

  const gallery = document.getElementById('gallery');

  images.forEach(img => {
    const col = document.createElement('div');
    col.className = 'col';
    col.innerHTML = `
      <div class="card" onclick="showOriginal('${img}')">
        <img src="new/${img}" alt="Edited version of ${img}" 
          onerror="this.onerror=null; this.src='https://via.placeholder.com/400x300?text=Edited+Not+Found';">
      </div>`;
    gallery.appendChild(col);
  });

  function showOriginal(filename) {
    const originalImg = document.getElementById('originalImage');
    const loadingSpinner = document.getElementById('loadingSpinner');
    const modalTitle = document.getElementById('modalTitle');
    originalImg.style.display = 'none';       // hide old image
    loadingSpinner.style.display = 'inline-block'; // show spinner
    modalTitle.textContent = `Original Photo - ${filename}`;
    originalImg.alt = `Original version of ${filename}`;

    // Show the modal immediately
    const modal = new bootstrap.Modal(document.getElementById('originalModal'));
    modal.show();

    // Clear src to reset image load event
    originalImg.src = '';

    originalImg.onload = () => {
      loadingSpinner.style.display = 'none';
      originalImg.style.display = 'block';
    };

    originalImg.onerror = () => {
      loadingSpinner.style.display = 'none';
      originalImg.style.display = 'block';
      originalImg.src = 'https://via.placeholder.com/600x400?text=Original+Not+Found';
      originalImg.alt = 'Original photo not found';
    };

    // Start loading the original image
    originalImg.src = `old/${IMG_3163}`;
  }
</script>

</body>
</html>
