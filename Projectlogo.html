<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Design Project</title>
  <link rel="stylesheet" href="assets/css/style.css">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <!-- FontAwesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(45deg, #6a11cb, #2575fc, #00c6ff, #ff8a00);
      background-size: 400% 400%;
      animation: gradientAnimation 15s ease infinite;
      color: white;
    }

    @keyframes gradientAnimation {
      0%, 100% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
    }

    header,
    footer {
      background: rgba(0, 0, 0, 0.7);
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
    }

    header {
      padding: 50px 0;
    }

    footer {
      padding: 20px 0;
    }

    h2 {
      color: white;
      text-align: center;
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
    }

    .btn-primary {
      background-color: transparent;
      border: 2px solid white;
    }

    .btn-primary:hover {
      background-color: gray;
    }

    .btn-secondary {
      background-color: transparent;
      border: 2px solid white;
      color: white;
    }

    .btn-secondary:hover {
      background-color: gray;
      color: white;
    }
  </style>
</head>

<body>
  <header class="text-center">
    <div style="text-align: left;">
      <a href="homepage.html" class="btn btn-secondary">Back to Homepage</a>
      <a href="project.html" class="btn btn-secondary">Back</a>
    </div>

    <div class="container">
      <h1>Logo Design Project</h1>
      <p>Select to view logos for a specific project:</p> <br>
      <div class="button-container text-center" id="buttonContainer"></div>
    </div>
  </header>

  <main>
    <div class="container my-5">
      <h2 id="projectTitle"></h2>
      <div class="row row-cols-1 row-cols-md-3 g-4" id="logoContainer"></div>
    </div>
  </main>

  <footer class="text-center">
    <div class="container">
      <p>&copy; <span id="year"></span> Carlo J. Baleje. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const projectFolders = {
      'the_vintage_lab': 'img/logo/The Vintage Lab.jpg',
      'paraluman_leasing_corp': 'img/logo/Paraluman Leasing Corp.jpg',
      'nosuya_habit': 'img/logo/Nosuya Habit.jpg',
      'mk': 'img/logo/MK.png',
      'kenzo_athena': 'img/logo/KABG.jpg',
      'eva_beauty': 'img/logo/Eva Bueaty Products.jpg',
      'blessed_AD': 'img/logo/Blessed A.D Glass And Aluminum Services.jpg'
    };

    const projectNames = Object.keys(projectFolders);
    const buttonContainer = document.getElementById('buttonContainer');
    const logoContainer = document.getElementById('logoContainer');
    const projectTitle = document.getElementById('projectTitle');

    // Create buttons dynamically
    projectNames.forEach(name => {
      const button = document.createElement('button');
      button.textContent = name.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
      button.className = 'btn btn-primary mx-2 mt-2';
      button.onclick = () => displayLogo(name);
      buttonContainer.appendChild(button);
    });

    function displayLogo(projectKey) {
      const imagePath = projectFolders[projectKey];
      logoContainer.innerHTML = `
        <div class='col'>
          <div class='card text-center'>
            <div class='d-flex justify-content-center align-items-center'>
              <img src="${imagePath}" alt="${projectKey}" class="card-img-top" style="max-width: 100%; height: auto;">
            </div>
          </div>
        </div>`;
      projectTitle.textContent = projectKey.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
    }

    // Display default
    displayLogo('the_vintage_lab');

    // Update year
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>

</html>
