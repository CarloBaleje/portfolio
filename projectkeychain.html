<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keychain Designs</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(45deg, #6a11cb, #2575fc, #00c6ff, #ff8a00);
      background-size: 400% 400%;
      animation: gradientAnimation 15s ease infinite;
      color: white;
    }

    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .gallery-box {
      background: rgba(0,0,0,0.75);
      border-radius: 15px;
      padding: 30px;
    }

    .title {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
    }

    .card {
      border-radius: 12px;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
    }

    .card-body {
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

<div class="container py-5">
  <div class="gallery-box">

    <h2 class="title">Keychain Designs</h2>

    <div class="row g-4">

      <!-- Keychain Item -->
      <div class="col-sm-6 col-md-4">
        <div class="card">
          <img src="keychain1.jpg" alt="Keychain Design">
          <div class="card-body">
            Acrylic Keychain
          </div>
        </div>
      </div>

      <div class="col-sm-6 col-md-4">
        <div class="card">
          <img src="keychain2.jpg" alt="Keychain Design">
          <div class="card-body">
            Custom Logo Keychain
          </div>
        </div>
      </div>

      <div class="col-sm-6 col-md-4">
        <div class="card">
          <img src="keychain3.jpg" alt="Keychain Design">
          <div class="card-body">
            Souvenir Keychain
          </div>
        </div>
      </div>

      <!-- Copy–paste lang para dumami -->
    </div>

    <div class="text-center mt-4">
      <a href="project.html" class="btn btn-light">Back to Projects</a>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
