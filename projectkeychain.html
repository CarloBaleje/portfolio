<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keychain Designs</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(45deg, #6a11cb, #2575fc, #00c6ff, #ff8a00);
      background-size: 400% 400%;
      animation: gradientAnimation 15s ease infinite;
      color: white;
    }

    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .gallery-box {
      background: rgba(0,0,0,0.75);
      border-radius: 15px;
      padding: 30px;
    }

    .title {
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
    }

    .card {
      border-radius: 12px;
      overflow: hidden;
    }

    .card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      cursor: pointer; /* show user it’s clickable */
    }

    .card-body {
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>

<div class="container py-5">
  <div class="gallery-box">

    <h2 class="title">Souvenirs</h2>

    <div class="row g-4">

      <!-- Souvenirs cards -->
      <div class="col-sm-6 col-md-4">
        <div class="card">
          <img src="keychain1.jpg" alt="Keychain 1" class="img-fluid"
               data-bs-toggle="modal" data-bs-target="#imageModal" data-bs-img="keychain1.jpg">
          <div class="card-body"></div>
        </div>
      </div>

      <div class="col-sm-6 col-md-4">
        <div class="card">
          <img src="keychain2.jpg" alt="Keychain 2" class="img-fluid"
               data-bs-toggle="modal" data-bs-target="#imageModal" data-bs-img="keychain2.jpg">
          <div class="card-body"></div>
        </div>
      </div>

      <div class="col-sm-6 col-md-4">
        <div class="card">
          <img src="keychain3.jpg" alt="Keychain 3" class="img-fluid"
               data-bs-toggle="modal" data-bs-target="#imageModal" data-bs-img="keychain3.jpg">
          <div class="card-body"></div>
        </div>
      </div>

      <div class="col-sm-6 col-md-4">
        <div class="card">
          <img src="calendar1.jpg" alt="Calendar 1" class="img-fluid"
               data-bs-toggle="modal" data-bs-target="#imageModal" data-bs-img="calendar1.jpg">
          <div class="card-body"></div>
        </div>
      </div>

      <div class="col-sm-6 col-md-4">
        <div class="card">
          <img src="calendar2.jpg" alt="Calendar 2" class="img-fluid"
               data-bs-toggle="modal" data-bs-target="#imageModal" data-bs-img="calendar2.jpg">
          <div class="card-body"></div>
        </div>
      </div>

      <div class="col-sm-6 col-md-4">
        <div class="card">
          <img src="giftcard.jpg" alt="Giftcard" class="img-fluid"
               data-bs-toggle="modal" data-bs-target="#imageModal" data-bs-img="giftcard.jpg">
          <div class="card-body"></div>
        </div>
      </div>

      <div class="col-sm-6 col-md-4">
        <div class="card">
          <img src="mug.jpg" alt="Mug 1" class="img-fluid"
               data-bs-toggle="modal" data-bs-target="#imageModal" data-bs-img="mug.jpg">
          <div class="card-body"></div>
        </div>
      </div>

      <div class="col-sm-6 col-md-4">
        <div class="card">
          <img src="mug2.jpg" alt="Mug 2" class="img-fluid"
               data-bs-toggle="modal" data-bs-target="#imageModal" data-bs-img="mug2.jpg">
          <div class="card-body"></div>
        </div>
      </div>

      <div class="col-sm-6 col-md-4">
        <div class="card">
          <img src="nameplate.jpg" alt="Nameplate" class="img-fluid"
               data-bs-toggle="modal" data-bs-target="#imageModal" data-bs-img="nameplate.jpg">
          <div class="card-body"></div>
        </div>
      </div>

      <div class="col-sm-6 col-md-4">
        <div class="card">
          <img src="totebag.jpg" alt="Totebag" class="img-fluid"
               data-bs-toggle="modal" data-bs-target="#imageModal" data-bs-img="totebag.jpg">
          <div class="card-body"></div>
        </div>
      </div>

      <div class="col-sm-6 col-md-4">
        <div class="card">
          <img src="wallet.jpg" alt="Wallet" class="img-fluid"
               data-bs-toggle="modal" data-bs-target="#imageModal" data-bs-img="wallet.jpg">
          <div class="card-body"></div>
        </div>
      </div>

    </div>

    <div class="text-center mt-4">
      <a href="project.html" class="btn btn-light">Back to Projects</a>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Modal -->
<div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content bg-transparent border-0">
      <div class="modal-body p-0 position-relative">
        <button type="button" class="btn-close position-absolute top-0 end-0 m-2" data-bs-dismiss="modal" aria-label="Close"></button>
        <img src="" id="modalImage" class="img-fluid w-100" alt="Enlarged Image">
      </div>
    </div>
  </div>
</div>

<script>
  const imageModal = document.getElementById('imageModal');
  const modalImage = document.getElementById('modalImage');

  imageModal.addEventListener('show.bs.modal', event => {
    const triggerImg = event.relatedTarget;
    const imgSrc = triggerImg.getAttribute('data-bs-img');
    modalImage.src = imgSrc;
  });
</script>

</body>
</html>
