<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>T-Shirt Designs Project</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(45deg, #6a11cb, #2575fc, #00c6ff, #ff8a00);
      background-size: 400% 400%;
      animation: gradientAnimation 15s ease infinite;
      color: white;
    }

    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header, footer {
      background: rgba(0, 0, 0, 0.7);
      text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.7);
    }

    header {
      padding: 50px 0;
      text-align: center;
      position: relative;
    }

    footer {
      padding: 20px 0;
      text-align: center;
    }

    header h1, header p, footer p {
      color: white;
    }

    /* Buttons */
    .btn-primary {
      background-color: transparent;
      border: 2px solid white;
      color: white;
    }
    .btn-primary:hover {
      background-color: gray;
      color: white;
    }

    .btn-secondary {
      background-color: transparent;
      border: 2px solid white;
      color: white;
    }
    .btn-secondary:hover {
      background-color: gray;
      color: white;
    }

    /* Back buttons container */
    #back-buttons {
      position: absolute;
      top: 10px;
      left: 20px;
    }

    #back-buttons a {
      margin-right: 10px;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      padding: 10px;
    }
    .card img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>

<header>
  <div id="back-buttons">
    <a href="homepage.html" class="btn btn-secondary">Back to Homepage</a>
    <a href="project.html" class="btn btn-secondary">Back</a>
  </div>

  <h1>T-Shirt Designs</h1>
  <p>Select to view T-shirt for a specific project:</p>

  <div class="button-container mb-3">
    <button class="btn btn-primary mx-2" onclick="loadProject('nosuya shirt')">Nosuya Shirt</button>
    <button class="btn btn-primary mx-2" onclick="loadProject('Make Some Money')">Make Some Money</button>
    <button class="btn btn-primary mx-2" onclick="loadProject('Ambel')">Ambel</button>
    <button class="btn btn-primary mx-2" onclick="loadProject('MYRAS KEYBOARD SQUAD')">MYRA'S KEYBOARD SQUAD</button>
    <button class="btn btn-primary mx-2" onclick="loadProject('Blessed AD')">Blessed Ad Glass and Aluminum Services</button>
    <button class="btn btn-primary mx-2" onclick="loadProject('Hustle Play Clo.')">Hustle Play Clo.</button>
    <button class="btn btn-primary mx-2" onclick="loadProject('Sabado Nights')">Sabado Nights</button>
    <button class="btn btn-primary mx-2" onclick="loadProject('Cafe Eleven')">Cafe Eleven'</button>
  </div>
</header>

<main class="container my-5">
  <h2 id="project-title">Nosuya Shirt</h2>
  <div class="row row-cols-1 row-cols-md-3 g-4" id="project-gallery"></div>
</main>

<footer>
  <p>&copy; 2024 My Portfolio. All Rights Reserved.</p>
</footer>

<script>
  // Map project names to image paths (can be multiple images per project)
  const projects = {
    'nosuya shirt': [
      'FRONT BACK white s.jpg'
    ],
    'Make Some Money': [
      'FRONT BACK BLACK MSM.jpg'
    ],
    'Ambel': [
      'Ambel.jpg',
      'ambel.png'
    ],
    'MYRAS KEYBOARD SQUAD': [
      'MYRAS KEYBOARD SQUAD.jpg'
    ],
    'Blessed AD': [
      'Blessed Ad Glass and Aluminum Services.jpg'
    ],
    'Hustle Play Clo.': [
      'makemoney.png',
      'spartan.png'
    ],
    'Sabado Nights': [
      'sabadonights.png'
    ],
    'Cafe Eleven': [
      'cafe11.png'
    ],
  };

  // Function to load project images dynamically
  function loadProject(projectName) {
    const gallery = document.getElementById('project-gallery');
    const title = document.getElementById('project-title');

    title.textContent = projectName;

    // Clear previous images
    gallery.innerHTML = '';

    // Get image list for the project or empty array
    const images = projects[projectName] || [];

    if(images.length === 0) {
      gallery.innerHTML = '<p class="text-center text-white">No images available in this category.</p>';
      return;
    }

    // Create cards for each image
    images.forEach(imgSrc => {
      const col = document.createElement('div');
      col.className = 'col';

      col.innerHTML = `
        <div class="card">
          <img src="${imgSrc}" alt="${projectName}">
        </div>
      `;

      gallery.appendChild(col);
    });
  }

  // Load default project on page load
  window.onload = () => loadProject('nosuya shirt');
</script>

</body>
</html>
